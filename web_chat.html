<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172335;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}#app{max-width:980px;margin:auto;min-height:100vh;display:flex;flex-direction:column}header{padding:26px 24px 16px;border-bottom:1px solid #dde3eb}h1{margin:0 0 5px;font-size:24px}header p{margin:0;color:#607084;font-size:13px}main{flex:1;padding:22px;display:flex;flex-direction:column;gap:16px}.welcome{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:20px;color:#46586d}.row{display:flex}.row.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.55}.user .bubble{background:#2459ba;color:white}.agent .bubble{background:white;border:1px solid #dfe5ed}.progress,.result{background:white;border:1px solid #dfe5ed;border-radius:14px;padding:15px 18px;max-width:90%}.progress{color:#576b82;font-size:13px}.progress div{margin:5px 0}.progress div:before{content:"✓ ";color:#1b8c60}.result h2{font-size:16px;margin:0 0 12px}.badge{display:inline-block;background:#e8eefc;color:#244ba1;padding:5px 9px;border-radius:8px;font-weight:700}.result p{line-height:1.55}.result h3{font-size:13px;color:#53657a;margin:17px 0 7px}.result ul,.result ol{margin:0;padding-left:20px;line-height:1.6}.source{background:#f7f9fc;border-radius:8px;padding:10px;margin:7px 0;font-size:12px}.source strong{display:block;margin-bottom:4px}.source details summary{cursor:pointer;color:#345aa0}.source pre{white-space:pre-wrap;font-family:inherit;line-height:1.45}form{position:sticky;bottom:0;background:#f5f7fb;border-top:1px solid #dde3eb;padding:14px 22px 20px;display:flex;gap:9px}select,input,button{border-radius:9px;font-size:14px}select,input{border:1px solid #cbd6e2;background:white;padding:11px}input{flex:1;min-width:0}button{border:0;background:#2459ba;color:white;padding:0 19px;cursor:pointer}button:disabled{opacity:.55;cursor:default}@media(max-width:650px){form{flex-wrap:wrap}select{width:100%}.bubble,.progress,.result{max-width:100%}}
</style>
</head>
<body><div id="app">
<header><h1>Policy Agent</h1><p>규정 근거를 찾아 신청 가능 여부와 절차를 안내합니다 · {{ backend }}</p></header>
<main ref="logEl">
  <div v-if="!log.length" class="welcome">학사 규정을 선택하고 질문을 입력하세요. 실제 규정 문서가 등록되지 않았다면 판단을 유보합니다.</div>
  <template v-for="item in log" :key="item.id">
    <div v-if="item.kind==='user'" class="row user"><div class="bubble">{{ item.text }}</div></div>
    <div v-else-if="item.kind==='steps'" class="progress"><div v-for="(step,i) in item.steps" :key="i">{{ step }}</div></div>
    <div v-else-if="item.kind==='error'" class="row agent"><div class="bubble">{{ item.text }}</div></div>
    <div v-else-if="item.kind==='result'" class="result">
      <h2>검증된 안내 <span class="badge">{{ statusLabel(item.analysis?.eligibility) }}</span></h2>
      <p>{{ item.analysis?.reason || item.reply }}</p>
      <template v-if="item.analysis?.conditions?.length"><h3>적용 조건</h3><ul><li v-for="(x,i) in item.analysis.conditions" :key="i">{{ x.text }}</li></ul></template>
      <template v-if="item.analysis?.documents?.length"><h3>필요 서류</h3><ul><li v-for="(x,i) in item.analysis.documents" :key="i">{{ x.text }}</li></ul></template>
      <template v-if="item.analysis?.procedure?.length"><h3>신청 절차</h3><ol><li v-for="(x,i) in item.analysis.procedure" :key="i">{{ x.text }}</li></ol></template>
      <p v-if="item.analysis?.deadline?.text"><b>신청 기한:</b> {{ item.analysis.deadline.text }}</p>
      <p v-if="item.analysis?.department?.text"><b>담당 부서:</b> {{ item.analysis.department.text }}</p>
      <p v-if="item.analysis?.follow_up_question"><b>추가 확인:</b> {{ item.analysis.follow_up_question }}</p>
      <template v-if="item.sources?.length"><h3>검색된 규정</h3><div v-for="s in item.sources" :key="s.id" class="source"><strong>{{ s.document_name }} {{ s.article }} {{ s.page ? `${s.page}쪽` : '' }}</strong><details><summary>원문 발췌 보기</summary><pre>{{ s.text }}</pre></details></div></template>
    </div>
  </template>
</main>
<form @submit.prevent="send"><select v-model="domain" :disabled="sending" aria-label="규정 분야"><option value="academic">학사 규정</option><option value="corporate">사내 규정</option></select><input v-model="input" placeholder="예: 부전공을 취소하려면 어떤 서류가 필요한가요?" aria-label="질문"><button :disabled="sending || !input.trim()">{{ sending ? '확인 중' : '질문하기' }}</button></form>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const {createApp,ref,reactive,nextTick,watch}=Vue;
const labels={eligible:'신청 가능',conditional:'조건부 가능',ineligible:'신청 불가',need_more_information:'추가 확인 필요'};
const stages={RouteDecided:'질문 유형 분석 중',ContextAnalyzed:'사용자 조건 분석 중',PlanCreated:'검색 계획 수립',ResearchCompleted:'관련 규정 검색 중',ReplanCheck:'검색 근거 확인 중',PolicyAnalyzed:'신청 조건 검토 중',MissingInformation:'추가 정보 확인 중',DraftWritten:'답변 작성 중',Validation:'답변 검증 중',Finalize:'최종 결과 생성 완료'};
createApp({setup(){
  const log=ref([]),input=ref(''),domain=ref('academic'),sending=ref(false),backend=ref(''),logEl=ref(null);
  watch(domain,()=>{log.value=[]});
  function threadFor(selected){const key='policy-thread-'+selected;let thread=localStorage.getItem(key);if(!thread){thread='policy-'+crypto.randomUUID();localStorage.setItem(key,thread)}return thread}
  let id=0;
  fetch('/health').then(r=>r.json()).then(h=>backend.value=h.llm_backend).catch(()=>{});
  async function scroll(){await nextTick();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
  function send(){const message=input.value.trim();if(!message||sending.value)return;input.value='';sending.value=true;
    log.value.push({id:id++,kind:'user',text:message});const steps=reactive({id:id++,kind:'steps',steps:[]});log.value.push(steps);scroll();
    const es=new EventSource(`/chat/stream?message=${encodeURIComponent(message)}&thread_id=${encodeURIComponent(threadFor(domain.value))}&domain=${encodeURIComponent(domain.value)}`);
    let complete=false;
    es.onmessage=ev=>{if(ev.data==='[DONE]'){es.close();sending.value=false;return;}let data;try{data=JSON.parse(ev.data)}catch{return}
      if(data.type==='FinalAnswer'){complete=true;log.value.push({id:id++,kind:'result',...data});scroll();return}
      if(data.type==='Error'){complete=true;log.value.push({id:id++,kind:'error',text:'처리 오류: '+data.message});scroll();return}
      const label=stages[data.type];if(label && steps.steps.at(-1)!==label){steps.steps.push(label);scroll()}
    };
    es.onerror=()=>{es.close();sending.value=false;if(!complete)log.value.push({id:id++,kind:'error',text:'연결이 끊어졌습니다. 다시 시도해 주세요.'})};
  }
  return {log,input,domain,sending,backend,logEl,send,statusLabel:s=>labels[s]||'확인 필요'};
}}).mount('#app');
</script></body></html>
